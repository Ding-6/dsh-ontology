# dsh-ontology bundle patch.
#
# One row, mounted by package name: the host half (exports ".") runs in the
# DSH host process (settings store, ontology ledger, ontology_* agent tools,
# /ontology-api routes), and the `dsh.client` declaration in package.json makes
# the browser half (exports "./client") load in the web GUI as a sidebar panel.
- insert:
    - id: dsh-ontology
      name: '@ding-6/dsh-ontology'
